v_fwd_kmh = 30
v_rev_kmh = 10
a_brake_mps2 = 2.0      # loaded, service brake, dry haul road
design_grade = 0.0625   # 1 in 16 downgrade (check site haul-road SOP)
tag_height_m = 1.7

