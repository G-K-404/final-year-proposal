# Machine Safety Profiles (MSP) - input to design_calcs.py
#
# Every machine class gets its own profile. design_calcs.py turns a profile into
#   (1) speed-adaptive stop / warning / awareness zone sizes,
#   (2) exact sensor coordinates (from the placement rules of the profile's `kit`),
#   (3) coverage checks.
#
# VALUES ARE REPRESENTATIVE OF EACH CLASS, NOT OF A SPECIFIC SCCL MACHINE.
# Before installation, replace length/width/height, speeds, braking and grades
# with the OEM data sheet + the mine's traffic SOP, then re-run the script.
#
# Body frame (all sensor coordinates): origin = centre of the machine footprint at
# ground level, x = forward, y = left, z = up (ISO 8855 style). Units: metres.
# For swing machines the frame is the rotating house, origin = swing centre.

[defaults]
t_sys_s        = 0.3   # sensing + comms + decision + alarm actuation budget (s)
t_react_s      = 1.5   # alerted operator perception-reaction time (s)
t_warn_extra_s = 2.0   # warning issued this much earlier than the stop boundary (s)
t_aware_extra_s = 3.0  # awareness band beyond the warning boundary (s)
v_ped_mps      = 1.5   # worst-case pedestrian walking toward the machine path (m/s)
sigma_pos_m    = 0.25  # 1-sigma relative position error inside 10 m (design target)
k_sigma        = 2.0   # uncertainty inflation (Jobes et al.: position = circle, not point)
buffer_m       = 1.0   # fixed buffer: mirrors, overhangs, tag-on-helmet vs body extent
g              = 9.81

